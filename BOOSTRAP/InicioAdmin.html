<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Gráfica Integrada con Bootstrap</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Pequeño ajuste para que el body ocupe toda la altura y centrar contenido verticalmente */
        body {
            min-height: 100vh;
            background-color: var(--bs-body-bg);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .card {
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>

<body>
    <div class="container py-5">

        <!-- Cabecera de la página -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Rendimiento de Ventas</h2>
                <p class="text-secondary mb-0">Demostración de Chart.js con variables de Bootstrap</p>
            </div>

            <!-- Botón para alternar tema claro/oscuro -->
            <button id="themeToggleBtn" class="btn btn-outline-secondary d-flex align-items-center gap-2 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-moon-stars-fill" viewBox="0 0 16 16">
                    <path
                        d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z" />
                </svg>
                Alternar Tema
            </button>
        </div>


        <!-- Tarjeta del Dashboard -->
        <div class="row">
            <div class="col-12 col-lg-10 mx-auto">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-header bg-transparent border-bottom py-3">
                        <h5 class="mb-0 text-body">Resumen Anual</h5>
                    </div>
                    <div class="card-body p-4">
                        <!-- El contenedor del canvas debe ser relativo para que Chart.js sea responsivo -->
                        <div class="position-relative w-100" style="height: 400px;">
                            <canvas id="miGrafica"></canvas>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-top text-muted small py-3">
                        Los colores de esta gráfica se leen directamente de <code>:root</code> usando JavaScript,
                        garantizando integración perfecta con temas.
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script>
        // Referencias globales
        let miGrafica;
        const htmlElement = document.documentElement;

        // Función utilitaria para leer variables CSS globales del elemento html
        function getBSVar(varName) {
            return getComputedStyle(htmlElement).getPropertyValue(varName).trim();
        }


        // Configuración e inicialización de la gráfica
        function initChart() {
            const ctx = document.getElementById('miGrafica').getContext('2d');

            // Leemos las variables iniciales de Bootstrap
            const colorPrimario = getBSVar('--bs-primary');
            const colorInfo = getBSVar('--bs-info');
            const colorTexto = getBSVar('--bs-body-color');
            const colorBorde = getBSVar('--bs-border-color');
            const fuenteBS = getBSVar('--bs-font-sans-serif');


            miGrafica = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio'],
                    datasets: [
                        {
                            label: 'Ventas 2023',
                            data: [120, 190, 130, 150, 120, 180],
                            backgroundColor: colorPrimario, // Usamos variable de Bootstrap
                            borderRadius: 6, // Esquinas redondeadas estilo Bootstrap
                            borderSkipped: false
                        },
                        {
                            label: 'Ventas 2024',
                            data: [150, 210, 170, 190, 140, 220],
                            backgroundColor: colorInfo, // Usamos variable de Bootstrap
                            borderRadius: 6,
                            borderSkipped: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: colorTexto, // Color de texto dinámico
                                font: {
                                    family: fuenteBS,
                                    size: 14
                                }
                            }
                        },
                        tooltip: {
                            bodyFont: { family: fuenteBS },
                            titleFont: { family: fuenteBS }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: colorTexto,
                                font: { family: fuenteBS }
                            },
                            grid: {
                                color: colorBorde, // Líneas divisorias con color de borde de BS
                                drawBorder: false
                            }
                        },
                        y: {
                            ticks: {
                                color: colorTexto,
                                font: { family: fuenteBS }
                            },
                            grid: {
                                color: colorBorde,
                                drawBorder: false
                            }
                        }
                    }
                }
            });
        }


        // Función para cambiar de tema y actualizar los colores de la gráfica en vivo
        function toggleTheme() {
            // Alternamos el atributo de Bootstrap
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-bs-theme', newTheme);

            // Actualizamos la apariencia del botón (opcional, para feedback visual)
            const btn = document.getElementById('themeToggleBtn');
            if (newTheme === 'dark') {
                btn.classList.replace('btn-outline-secondary', 'btn-outline-light');
            } else {
                btn.classList.replace('btn-outline-light', 'btn-outline-secondary');
            }


            // Damos un pequeño respiro (timeout) para que el navegador recalcule los estilos CSS
            // antes de que JavaScript intente leer las variables nuevamente.
            setTimeout(() => {
                // Leemos los nuevos colores basados en el nuevo tema activo
                const nuevoColorTexto = getBSVar('--bs-body-color');
                const nuevoColorBorde = getBSVar('--bs-border-color');
                const nuevoColorPrimario = getBSVar('--bs-primary');
                const nuevoColorInfo = getBSVar('--bs-info');


                // Actualizamos las propiedades dentro del objeto de Chart.js
                miGrafica.data.datasets[0].backgroundColor = nuevoColorPrimario;
                miGrafica.data.datasets[1].backgroundColor = nuevoColorInfo;

                miGrafica.options.plugins.legend.labels.color = nuevoColorTexto;
                miGrafica.options.scales.x.ticks.color = nuevoColorTexto;
                miGrafica.options.scales.y.ticks.color = nuevoColorTexto;
                miGrafica.options.scales.x.grid.color = nuevoColorBorde;
                miGrafica.options.scales.y.grid.color = nuevoColorBorde;


                // Redibujamos la gráfica con la nueva configuración
                miGrafica.update();
            }, 50);
        }


        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            initChart();

            document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
        });
    </script>
</body>

</html>
